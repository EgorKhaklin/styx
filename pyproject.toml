[project]
name = "styx"
version = "0.1.0"
description = "Charon-style weight transforms W = T(raw) in neural networks: a small, checked experiment."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.8", "scikit-learn>=1.4"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["styx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
